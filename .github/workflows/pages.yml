name: Pages

# Tests run on every push and pull request; deploy to GitHub Pages happens
# only after tests pass on main. Action versions are pinned to node24-runtime
# releases (checked 2026-07-07).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip pytest
      - run: pytest -q

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read   # job-level permissions replace the workflow default; checkout needs this
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Publish only the site itself, from an ALLOW-list in scripts/stage_site.py (this.i @m6dofkv2).
      #
      # This was an `rsync --exclude=...` deny-list until 2026-09-17, which makes the published set
      # "everything nobody thought to exclude" -- so it fails open on every file added after the list
      # was written, silently. It published this.i and .mcp.json that way, and this.i carries every
      # term @feshtwgl bans from the site. The list now lives in one place that both this workflow
      # and tests/test_publish_set.py read, and that test runs THIS stager rather than describing it.
      - name: Stage site
        run: python3 scripts/stage_site.py _site

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      # We do NOT use actions/upload-pages-artifact. It tars the site with
      # `--exclude=".[^/]*"`, which drops every top-level dot-entry and would silently strip both
      # `.well-known/` and `.nojekyll` -- the deploy goes green and the discovery endpoint 404s,
      # which is exactly what happened on the first deploy of this endpoint. The action exposes no
      # option to disable it. So we build the identical `github-pages` artifact ourselves: a plain
      # tar of _site excluding only .git. The Pages CDN serves `.well-known` fine; the action was
      # the only barrier. bakobo/schema hit this first and reached the same fix (its this.i
      # @o6bw3k). `include-hidden-files` is load-bearing for the same reason.
      - name: Archive the site as the github-pages artifact (keeping .well-known)
        run: |
          tar --dereference --hard-dereference --directory _site \
            -cf "$RUNNER_TEMP/artifact.tar" --exclude=.git .
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: "1"
          include-hidden-files: "true"
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
