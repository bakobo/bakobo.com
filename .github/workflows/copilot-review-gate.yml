name: Copilot Review Gate

# Adds or removes Copilot as a PR reviewer based on the PR title and labels.
#
# Convention:
#   [no-ccr] in title or label "no-ccr"   -> Copilot is NOT requested as a reviewer
#                                            (any existing assignment is removed)
#   anything else                          -> Copilot IS requested as a reviewer
#
# The [light-ccr] convention is NOT handled here. CCR sees [light-ccr] in the
# title/body and self-narrows per .github/copilot-instructions.md. So this
# workflow only distinguishes "review or not" — light-vs-full is CCR's call.

on:
  pull_request:
    types: [opened, edited, reopened, ready_for_review, labeled, unlabeled, synchronize, converted_to_draft]

permissions:
  pull-requests: write

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether Copilot should review
        id: decide
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          set -euo pipefail
          skip=false
          if [[ "$PR_DRAFT" == "true" ]]; then
            skip=true
          fi
          if [[ "$PR_TITLE" == *"[no-ccr]"* ]]; then
            skip=true
          fi
          if echo "$PR_LABELS" | jq -e 'any(.[]; . == "no-ccr")' > /dev/null 2>&1; then
            skip=true
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      # This step SIGNALS that a review is wanted; it cannot confirm one will happen, and must not
      # pretend otherwise in either direction.
      #
      # A success status on the request endpoint is an acknowledgement that the signal was sent,
      # not a commitment that Copilot has started -- a review typically begins minutes later. So
      # failing the build when `requested_reviewers` does not immediately contain Copilot would be
      # wrong: it reads an asynchronous handoff as a synchronous result. An earlier revision of
      # this step did exactly that and asserted a cause ("Copilot code review is not enabled") it
      # had no way to know.
      #
      # The `|| echo ... Safe to ignore` this replaces was wrong in the other direction: it
      # swallowed a genuine non-zero exit, so a malformed call looked identical to a good one.
      #
      # So: fail only on a call that actually failed, and otherwise report what was observed
      # without diagnosing it. Whether a review arrives is visible on the PR, which is the right
      # place to look for it.
      - name: Signal that Copilot should review
        if: steps.decide.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/$REPO/pulls/$PR_NUMBER/requested_reviewers" \
            -f 'reviewers[]=Copilot' > /dev/null
          echo "Review request signalled for PR #$PR_NUMBER."
          if gh api "/repos/$REPO/pulls/$PR_NUMBER" \
               --jq '[.requested_reviewers[].login] | any(. == "Copilot")' | grep -qx true; then
            echo "Copilot is listed as a requested reviewer."
          else
            echo "::notice::Copilot is not yet listed as a requested reviewer. The signal was" \
                 "accepted; the request and the review are asynchronous and may land in a few" \
                 "minutes. Check the PR before assuming it will not arrive."
          fi

      - name: Remove Copilot as reviewer
        if: steps.decide.outputs.skip == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          gh api \
            --method DELETE \
            -H "Accept: application/vnd.github+json" \
            "/repos/$REPO/pulls/$PR_NUMBER/requested_reviewers" \
            -f 'reviewers[]=Copilot' \
            || echo "Note: removal returned non-zero; Copilot may not have been assigned. Safe to ignore."
