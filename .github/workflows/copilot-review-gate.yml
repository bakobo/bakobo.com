name: Copilot Review Gate

# Adds or removes Copilot as a PR reviewer based on the PR title and labels.
#
# Convention:
#   [no-ccr] in title or label "no-ccr"   -> Copilot is NOT requested as a reviewer
#                                            (any existing assignment is removed)
#   anything else                          -> Copilot IS requested as a reviewer
#
# The [light-ccr] convention is NOT handled here. CCR sees [light-ccr] in the
# title/body and self-narrows per .github/copilot-instructions.md. So this
# workflow only distinguishes "review or not" — light-vs-full is CCR's call.

on:
  pull_request:
    types: [opened, edited, reopened, ready_for_review, labeled, unlabeled, synchronize, converted_to_draft]

permissions:
  pull-requests: write

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether Copilot should review
        id: decide
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
          PR_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          set -euo pipefail
          skip=false
          if [[ "$PR_DRAFT" == "true" ]]; then
            skip=true
          fi
          if [[ "$PR_TITLE" == *"[no-ccr]"* ]]; then
            skip=true
          fi
          if echo "$PR_LABELS" | jq -e 'any(.[]; . == "no-ccr")' > /dev/null 2>&1; then
            skip=true
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

      # Verify rather than assume. On PR #1 this step reported success while requesting nothing:
      # the endpoint answers 200 with the unmodified pull request when it declines to add Copilot
      # -- which is what happens if Copilot code review is not enabled for the repository -- so an
      # exit status says only that the call was well-formed. The `|| echo` made it worse by
      # swallowing the one signal that was left. Read the response back instead: if Copilot is not
      # among the requested reviewers afterwards, the gate has not done its job and should say so.
      - name: Request Copilot as reviewer
        if: steps.decide.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/$REPO/pulls/$PR_NUMBER/requested_reviewers" \
            -f 'reviewers[]=Copilot' > /dev/null
          if gh api "/repos/$REPO/pulls/$PR_NUMBER" \
               --jq '[.requested_reviewers[].login] | any(. == "Copilot")' | grep -qx true; then
            echo "Copilot is requested as a reviewer."
          else
            echo "::error::Copilot was not added as a reviewer. The request endpoint accepted the" \
                 "call and changed nothing, which usually means Copilot code review is not enabled" \
                 "for $REPO (Settings -> Copilot -> Code review). Enable it, or mark the PR [no-ccr]."
            exit 1
          fi

      - name: Remove Copilot as reviewer
        if: steps.decide.outputs.skip == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          gh api \
            --method DELETE \
            -H "Accept: application/vnd.github+json" \
            "/repos/$REPO/pulls/$PR_NUMBER/requested_reviewers" \
            -f 'reviewers[]=Copilot' \
            || echo "Note: removal returned non-zero; Copilot may not have been assigned. Safe to ignore."
